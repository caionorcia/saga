appId: br.com.saga.mentoria
productName: Saga
copyright: Saga
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
npmRebuild: false
win:
  target:
    - target: nsis
      arch: x64
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Saga
  artifactName: Saga-Setup-${version}.${ext}
linux:
  target: dir
  icon: build/icon.png
publish:
  provider: github
  owner: caionorcia
  repo: saga
  releaseType: release
