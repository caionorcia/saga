name: Release

# Publica o instalador num GitHub Release quando se envia uma tag vX.Y.Z
on:
  push:
    tags: ['v*']
  # disparo manual (Actions › Release › Run workflow): o electron-builder cria a tag v<versão> e o Release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      # gera os arquivos sem publicar e depois cria o Release de uma vez só
      # (o upload paralelo do electron-builder disputava a criação do Release e perdia o .exe)
      - run: npx electron-builder --win --publish never
      # o app instalado só procura atualizações se tiver o resources/app-update.yml (gerado a partir de `publish`
      # no electron-builder.yml); falha aqui em vez de publicar um instalador que nunca se atualiza
      - name: Conferir app-update.yml
        shell: bash
        run: |
          cat dist/win-unpacked/resources/app-update.yml
          grep -q 'provider: github' dist/win-unpacked/resources/app-update.yml
          grep -q 'repo: saga' dist/win-unpacked/resources/app-update.yml
      - name: Publicar Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v$VERSION" dist/SagaZap-Setup-$VERSION.exe dist/SagaZap-Setup-$VERSION.exe.blockmap dist/latest.yml \
            --target "$GITHUB_SHA" --latest --title "SagaZap $VERSION" --notes "SagaZap $VERSION — instale com o arquivo SagaZap-Setup-$VERSION.exe"
